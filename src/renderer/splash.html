<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self';" />
    <title>My Dump Studio</title>
  </head>
  <body>
    <main class="splash" aria-label="My Dump Studio">
      <div class="artwork" aria-hidden="true">
        <img src="./assets/branding/splash-art.webp" alt="" />
      </div>
      <section class="identity">
        <div class="edition"><span id="edition-name">CHERRY PIE VERSION</span><span id="version"></span></div>
        <img class="app-icon" src="./assets/branding/studio-icon.png" alt="" width="72" height="72" />
        <div class="product">
          <h1>My Dump<br /><span>Studio</span></h1>
          <p class="description" id="description">Your photos, your style.</p>
          <div class="creator">
            <p>Created by <strong id="creator-name">Felipe Aguiar</strong></p>
            <nav aria-label="Creator profiles">
              <a id="creator-github" target="_blank" rel="noopener noreferrer">GitHub <span aria-hidden="true">↗</span></a>
              <span class="creator-divider" aria-hidden="true">/</span>
              <a id="creator-linkedin" target="_blank" rel="noopener noreferrer">LinkedIn <span aria-hidden="true">↗</span></a>
            </nav>
          </div>
        </div>
        <footer>
          <div class="loading" role="status" aria-live="polite">
            <span class="status-dot" aria-hidden="true"></span>
            <span id="status">Starting your studio…</span>
          </div>
          <div class="loading-track" aria-hidden="true"><span></span></div>
        </footer>
      </section>
    </main>
    <script type="module" src="./splash.ts"></script>
  </body>
</html>
