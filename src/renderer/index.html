<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="./assets/branding/noir-icon.png" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: blob: file: noir-asset:; media-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self' ws: http: https: noir-asset:; font-src 'self' data:;"
    />
    <title>Noir Dump Studio</title>
    <script>
      (() => {
        let theme = new URLSearchParams(location.search).get('theme')
        if (!theme) { try { theme = localStorage.getItem('noir-ui-theme-v1') } catch {} }
        theme = theme === 'noir_dark' ? 'noir_dark' : 'instagram_light'
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme === 'noir_dark' ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
