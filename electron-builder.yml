# Keep the existing Windows installer identity so upgrades find previous installs.
appId: me.dio.noirdumpstudio
productName: My Dump Studio
directories:
  buildResources: build
  output: "dist/1.0.0 - Cherry Pie Version"
releaseInfo:
  releaseName: "1.0.0 - Cherry Pie Version"
files:
  - out/**
  - package.json
extraResources:
  - from: build/icon.png
    to: my-dump-studio.png
asarUnpack:
  - "**/*.node"
  - resources/**
win:
  icon: build/icon.ico
  executableName: My Dump Studio
  target:
    - nsis
  artifactName: My-Dump-Studio-${version}-Cherry-Pie-Version-setup.${ext}
nsis:
  include: assets/branding/installer.nsh
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeader: build/installerHeader.bmp
  installerSidebar: build/installerSidebar.bmp
  installerLanguages: [en_US, pt_BR]
  shortcutName: My Dump Studio
  uninstallDisplayName: My Dump Studio ${version}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
